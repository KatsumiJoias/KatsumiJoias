# ============================================================================
# GitHub Actions — Deploy to Google Cloud Run (projeto katsumijoias)
# ============================================================================
#
# Trigger: push to `main`
#
# Required GitHub Secret (Settings → Secrets and variables → Actions):
#
#   GCP_SA_KEY — JSON completo da Service Account de *deploy* (ex.: github-deploy@katsumijoias...)
#                Papéis: run.admin, iam.serviceAccountUser, artifactregistry.writer
#                NÃO use account_service.json (Firebase Admin local).
#
# Project ID e região estão fixos neste repo (evita confundir nome "KatsumiJoias" com ID).
#
# ============================================================================

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: katsumijoias
  REGION: southamerica-east1
  SERVICE_NAME: katsumijoias-app
  AR_REPO: docker-repo
  IMAGE: southamerica-east1-docker.pkg.dev/katsumijoias/docker-repo/katsumijoias-app

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify deploy secret
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::Missing secret GCP_SA_KEY (JSON da SA github-deploy, não a chave Firebase local)."
            exit 1
          fi

      - name: Authenticate to Google Cloud (SA Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: katsumijoias

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: katsumijoias

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ env.IMAGE }}:${{ github.sha }}" \
            --tag "${{ env.IMAGE }}:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Show service URL
        run: |
          echo "Deployed successfully."
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)"

{% extends "base.html" %}

{% block title %}Recuperar Senha - Katsumi Joias{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-luxury-gray py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <h2 class="mt-6 text-center text-3xl font-serif font-bold text-luxury-black">
                Recuperar senha
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Digite seu email e enviaremos um link para redefinir sua senha
            </p>
        </div>

        <!-- Success/Error Messages -->
        <div id="auth-message" class="hidden rounded-md p-4">
            <p id="auth-message-text" class="text-sm"></p>
        </div>

        <!-- Reset Password Form -->
        <form id="reset-form" class="mt-8 space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required 
                       class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-luxury-gold focus:border-luxury-gold focus:z-10 sm:text-sm bg-white"
                       placeholder="seu@email.com">
            </div>

            <div>
                <button type="submit" id="reset-btn" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-luxury-gold hover:bg-luxury-gold-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-luxury-gold transition-colors duration-200">
                    Enviar link de recuperação
                </button>
            </div>

            <div class="text-center">
                <a href="/login" class="font-medium text-sm text-luxury-gold hover:text-green-700">
                    Voltar para login
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const firebaseConfig = {
        apiKey: "{{ firebase_config.apiKey }}",
        authDomain: "{{ firebase_config.authDomain }}",
        projectId: "{{ firebase_config.projectId }}",
        storageBucket: "{{ firebase_config.storageBucket }}",
        messagingSenderId: "{{ firebase_config.messagingSenderId }}",
        appId: "{{ firebase_config.appId }}"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function showMessage(message, isError = false) {
        const messageDiv = document.getElementById('auth-message');
        const messageText = document.getElementById('auth-message-text');
        
        messageDiv.classList.remove('hidden', 'bg-red-50', 'bg-green-50');
        messageText.classList.remove('text-red-800', 'text-green-800');
        
        if (isError) {
            messageDiv.classList.add('bg-red-50');
            messageText.classList.add('text-red-800');
        } else {
            messageDiv.classList.add('bg-green-50');
            messageText.classList.add('text-green-800');
        }
        
        messageText.textContent = message;
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const resetBtn = document.getElementById('reset-btn');
        
        resetBtn.disabled = true;
        resetBtn.textContent = 'Enviando...';
        
        try {
            await sendPasswordResetEmail(auth, email);
            showMessage('✓ Email enviado com sucesso! Verifique sua caixa de entrada e spam. Redirecionando...', false);
            
            // Clear form
            document.getElementById('email').value = '';
            
            setTimeout(() => {
                window.location.href = '/login';
            }, 3000);
        } catch (error) {
            console.error('Reset error:', error);
            let errorMessage = 'Não foi possível enviar o email de recuperação. Tente novamente.';
            
            switch (error.code) {
                case 'auth/user-not-found':
                    errorMessage = 'Nenhuma conta encontrada com este email. Verifique o email digitado.';
                    break;
                case 'auth/invalid-email':
                    errorMessage = 'Por favor, insira um email válido.';
                    break;
                case 'auth/too-many-requests':
                    errorMessage = 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
                    break;
                case 'auth/network-request-failed':
                    errorMessage = 'Erro de conexão. Verifique sua internet e tente novamente.';
                    break;
                default:
                    if (error.message.includes('email')) {
                        errorMessage = 'Problema com o email. Verifique e tente novamente.';
                    } else if (error.message.includes('network')) {
                        errorMessage = 'Erro de conexão. Verifique sua internet.';
                    }
            }
            
            showMessage(errorMessage, true);
        } finally {
            resetBtn.disabled = false;
            resetBtn.textContent = 'Enviar link de recuperação';
        }
    });
</script>
{% endblock %}

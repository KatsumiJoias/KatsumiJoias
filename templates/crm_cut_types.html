{% extends "crm_base.html" %}

{% block crm_content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8 flex items-start justify-between">
        <div>
            <h2 class="text-3xl font-bold text-gray-900">Tipos de Lapidação</h2>
            <p class="mt-2 text-sm text-gray-600">Lapidações disponíveis no cadastro de joias e gemas.</p>
        </div>
        <a href="{{ url_for('crm_ajustes') }}" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">Voltar</a>
    </div>

    <form method="POST" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-3">
        <div id="cut-types-list" class="space-y-2">
            {% for cut_type in cut_types %}
            <div class="flex gap-2 cut-row">
                <input type="text" name="cut_type[]" value="{{ cut_type }}"
                       class="flex-1 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm bg-gray-50">
                <button type="button" onclick="this.closest('.cut-row').remove()" class="px-3 text-sm text-red-600 hover:text-red-800">Remover</button>
            </div>
            {% endfor %}
        </div>
        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
            <button type="button" onclick="addCutType()" class="text-sm font-medium text-indigo-600 hover:text-indigo-800">+ Adicionar lapidação</button>
            <button type="submit" class="inline-flex items-center px-5 py-2.5 rounded-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700">Salvar</button>
        </div>
    </form>
</div>

<script>
function addCutType() {
    const row = document.createElement('div');
    row.className = 'flex gap-2 cut-row';
    row.innerHTML = '<input type="text" name="cut_type[]" class="flex-1 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm bg-gray-50">' +
        '<button type="button" onclick="this.closest(\'.cut-row\').remove()" class="px-3 text-sm text-red-600 hover:text-red-800">Remover</button>';
    document.getElementById('cut-types-list').appendChild(row);
    row.querySelector('input').focus();
}
</script>
{% endblock %}

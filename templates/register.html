{% extends "base.html" %}

{% block title %}Criar Conta - Paixão Pedras{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-luxury-gray py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <h2 class="mt-6 text-center text-3xl font-serif font-bold text-luxury-black">
                Criar uma nova conta
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Ou
                <a href="/login" class="font-medium text-luxury-gold hover:text-luxury-gold-dark">
                    entre na sua conta existente
                </a>
            </p>
        </div>

        <!-- Error/Success Messages -->
        <div id="auth-message" class="hidden rounded-md p-4">
            <p id="auth-message-text" class="text-sm"></p>
        </div>

        <!-- Google Sign Up -->
        <div>
            <button id="google-signup-btn" class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors duration-200">
                <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Cadastrar com Google
            </button>
        </div>

        <div class="relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-luxury-gray text-gray-500">Ou cadastre com email</span>
            </div>
        </div>

        <!-- Email/Password Sign Up -->
        <form id="register-form" class="mt-8 space-y-6">
            <div class="rounded-md shadow-sm space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                    <input id="name" name="name" type="text" required 
                           class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-luxury-gold focus:border-luxury-gold focus:z-10 sm:text-sm bg-white"
                           placeholder="João Silva">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required 
                           class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-luxury-gold focus:border-luxury-gold focus:z-10 sm:text-sm bg-white"
                           placeholder="seu@email.com">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha (mínimo 6 caracteres)</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6"
                           class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-luxury-gold focus:border-luxury-gold focus:z-10 sm:text-sm bg-white"
                           placeholder="••••••••">
                </div>
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Senha</label>
                    <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required minlength="6"
                           class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-luxury-gold focus:border-luxury-gold focus:z-10 sm:text-sm bg-white"
                           placeholder="••••••••">
                </div>
            </div>

            <div>
                <button type="submit" id="register-btn" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-luxury-gold hover:bg-luxury-gold-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-luxury-gold transition-colors duration-200">
                    Criar Conta
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const firebaseConfig = {
        apiKey: "{{ firebase_config.apiKey }}",
        authDomain: "{{ firebase_config.authDomain }}",
        projectId: "{{ firebase_config.projectId }}",
        storageBucket: "{{ firebase_config.storageBucket }}",
        messagingSenderId: "{{ firebase_config.messagingSenderId }}",
        appId: "{{ firebase_config.appId }}"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    function showMessage(message, isError = false) {
        const messageDiv = document.getElementById('auth-message');
        const messageText = document.getElementById('auth-message-text');
        
        messageDiv.classList.remove('hidden', 'bg-red-50', 'bg-green-50');
        messageText.classList.remove('text-red-800', 'text-green-800');
        
        if (isError) {
            messageDiv.classList.add('bg-red-50');
            messageText.classList.add('text-red-800');
        } else {
            messageDiv.classList.add('bg-green-50');
            messageText.classList.add('text-green-800');
        }
        
        messageText.textContent = message;
    }

    async function handleSuccessfulRegister(user) {
        try {
            const idToken = await user.getIdToken();
            
            const response = await fetch('/api/auth/verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ idToken: idToken })
            });
            
            if (response.ok) {
                showMessage('✓ Conta criada com sucesso! Bem-vindo(a)! Redirecionando...', false);
                setTimeout(() => {
                    window.location.href = '/account';
                }, 1500);
            } else {
                showMessage('Não foi possível verificar sua autenticação. Por favor, tente novamente.', true);
            }
        } catch (error) {
            console.error('Error:', error);
            showMessage('Erro de conexão. Verifique sua internet e tente novamente.', true);
        }
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const registerBtn = document.getElementById('register-btn');
        
        if (password !== confirmPassword) {
            showMessage('As senhas não coincidem. Por favor, digite a mesma senha nos dois campos.', true);
            return;
        }
        
        if (password.length < 6) {
            showMessage('A senha deve ter pelo menos 6 caracteres.', true);
            return;
        }
        
        registerBtn.disabled = true;
        registerBtn.textContent = 'Criando conta...';
        
        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            await updateProfile(userCredential.user, { displayName: name });
            await handleSuccessfulRegister(userCredential.user);
        } catch (error) {
            console.error('Register error:', error);
            let errorMessage = 'Não foi possível criar sua conta. Por favor, tente novamente.';
            
            switch (error.code) {
                case 'auth/email-already-in-use':
                    errorMessage = 'Este email já está cadastrado. Você já tem uma conta? Faça login.';
                    break;
                case 'auth/invalid-email':
                    errorMessage = 'Por favor, insira um email válido.';
                    break;
                case 'auth/weak-password':
                    errorMessage = 'Senha muito fraca. Use pelo menos 6 caracteres com letras e números.';
                    break;
                case 'auth/operation-not-allowed':
                    errorMessage = 'Cadastro não está habilitado no momento. Entre em contato com o suporte.';
                    break;
                case 'auth/network-request-failed':
                    errorMessage = 'Erro de conexão. Verifique sua internet e tente novamente.';
                    break;
                case 'auth/too-many-requests':
                    errorMessage = 'Muitas tentativas. Por favor, aguarde alguns minutos e tente novamente.';
                    break;
                default:
                    // Para erros não mapeados, mostra uma mensagem genérica amigável
                    if (error.message.includes('password')) {
                        errorMessage = 'Problema com a senha. Use pelo menos 6 caracteres.';
                    } else if (error.message.includes('email')) {
                        errorMessage = 'Problema com o email. Verifique e tente novamente.';
                    }
            }
            
            showMessage(errorMessage, true);
            registerBtn.disabled = false;
            registerBtn.textContent = 'Criar Conta';
        }
    });

    document.getElementById('google-signup-btn').addEventListener('click', async () => {
        try {
            const result = await signInWithPopup(auth, googleProvider);
            await handleSuccessfulRegister(result.user);
        } catch (error) {
            console.error('Google sign up error:', error);
            
            let errorMessage = 'Não foi possível cadastrar com Google.';
            
            switch (error.code) {
                case 'auth/popup-closed-by-user':
                    errorMessage = 'Cadastro cancelado. Você fechou a janela de cadastro.';
                    break;
                case 'auth/popup-blocked':
                    errorMessage = 'Pop-up bloqueado pelo navegador. Permita pop-ups para este site.';
                    break;
                case 'auth/cancelled-popup-request':
                    errorMessage = 'Cadastro cancelado. Apenas uma janela pode estar aberta por vez.';
                    break;
                case 'auth/account-exists-with-different-credential':
                    errorMessage = 'Este email já está cadastrado com outro método. Tente fazer login.';
                    break;
                case 'auth/network-request-failed':
                    errorMessage = 'Erro de conexão. Verifique sua internet e tente novamente.';
                    break;
                default:
                    errorMessage = 'Erro ao cadastrar com Google. Por favor, tente novamente.';
            }
            
            showMessage(errorMessage, true);
        }
    });
</script>
{% endblock %}
